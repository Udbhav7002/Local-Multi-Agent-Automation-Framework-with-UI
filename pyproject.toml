[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-multi-agent-framework"
version = "1.0.0"
description = "A local, autonomous multi-agent framework for OS automation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pyyaml",
    "jinja2",
    "pydantic-settings>=2.14.0",
    "httpx>=0.28.0",
    "prometheus-client>=0.26.0",
    "ollama>=0.1.6",
    "litellm>=1.0.0",
    "slowapi>=0.1.9",
    "chromadb>=0.4.22",
    "aiosqlite>=0.22.0",
    "opentelemetry-api>=1.43.0",
    "opentelemetry-sdk>=1.43.0",
    "mss>=9.0.1",
    "Pillow>=10.2.0",
    "pytesseract>=0.3.10",
    "opencv-python>=4.8.0",
    "pyautogui>=0.9.54",
    "playwright>=1.40.0",
    "SpeechRecognition>=3.10.0",
    "pyaudio>=0.2.14",
    "rich>=13.7.0",
    "numpy>=1.26.0",
    "aiohttp",
    "pydantic",
]

# Platform-specific dependencies
[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "hypothesis",
    "flake8",
    "black",
    "mypy"
]
macos = [
    "pyobjc-core<12.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz<12.0; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices<12.0; sys_platform == 'darwin'",
    "pyobjc-framework-CoreText<12.0; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa<12.0; sys_platform == 'darwin'",
    "pyobjc<12.0; sys_platform == 'darwin'",
]
windows = [
]
linux = [
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "memory*", "vision*", "agents*", "plugins*", "tools*", "skills*", "tests*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --asyncio-mode=auto --cov=core --cov=memory --cov=vision --cov=api --cov-report=term-missing --cov-fail-under=39"
testpaths = [
    "tests",
]

[tool.ruff]
target-version = "py310"
line-length = 100
lint.select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "ASYNC"]
lint.ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[tool.mypy.overrides]
module = [
    "core.*",
    "memory.*",
    "vision.*",
    "plugins.*",
    "tools.*",
    "main",
    "api",
    "tests.*",
]
