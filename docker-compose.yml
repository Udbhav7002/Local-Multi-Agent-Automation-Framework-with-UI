version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./jobs.db:/app/jobs.db
      - ./chroma_db:/app/chroma_db
      - ./skills:/app/skills
      - ./logs:/app/logs
      - ./screenshots:/app/screenshots
      - ./browser_profile:/app/browser_profile
      - ./settings.json:/app/settings.json
    environment:
      - ENV=production
      - AGENT_API_KEY=${AGENT_API_KEY}
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    user: "appuser"
